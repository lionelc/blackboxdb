shared_preload_libraries = 'citus,pg_cron,pg_blackboxdb_core,pg_blackboxdb,pg_blackboxdb_distributed,pg_blackboxdb_extended_rum'

citus.shard_count = 8

blackboxdb_core.bsonUseEJson = on

blackboxdb.indexBuildScheduleInSec = 1

blackboxdb.blockedRolePrefixList = 'blackboxdb,pg,citus'

blackboxdb.rum_library_load_option = 'require_blackboxdb_extended_rum'

# disable composite by default for now to have test coverage on non composite as well.
blackboxdb.defaultUseCompositeOpClass = 'false'

citus.allow_unsafe_constraints = 'true'
citus.propagate_set_commands = 'local'
citus.enable_non_colocated_router_query_pushdown='true'

# set compression threshold for index terms
blackboxdb.index_term_compression_threshold = 128

blackboxdb.indexBuildsScheduledOnBgWorker = off

blackboxdb.enableExplainScanIndexCosts = 'false'
blackboxdb.enable_default_extended_explain = 'false'
blackboxdb.enableExplainScanNamespaceName = 'false'

# Disable local retry table for existing tests for compatability, dedicated test enables it.
# TODO: We need to clean all the tests and enable this by default, and then it can be removed
blackboxdb.enableLocalRetryTable = 'false'
