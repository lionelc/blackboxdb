shared_preload_libraries = 'pg_cron,pg_blackboxdb_core,pg_blackboxdb,pg_blackboxdb_extended_rum'
blackboxdb.rum_library_load_option = 'require_blackboxdb_extended_rum'
blackboxdb.alternate_index_handler_name = 'extended_rum'
wal_level = replica
cron.database_name = 'postgres'
blackboxdb.enableBackgroundWorker = 'false'
blackboxdb.enableBackgroundWorkerJobs = 'false'
blackboxdb.enable_default_extended_explain = 'false'
blackboxdb.indexBuildsScheduledOnBgWorker = 'false'
max_wal_senders = 4
max_replication_slots = 4
listen_addresses = 'localhost'
