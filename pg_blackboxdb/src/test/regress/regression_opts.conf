
blackboxdb_core.bsonUseEJson = on
blackboxdb.blockedRolePrefixList = 'blackboxdb,pg'

blackboxdb.enableContinuationFastBitmapLookup = 'true'

blackboxdb.indexBuildsScheduledOnBgWorker = off

# Disable local retry table for existing tests for compatability, dedicated test enables it.
# TODO: We need to clean all the tests and enable this by default, and then it can be removed
blackboxdb.enableLocalRetryTable = 'false'