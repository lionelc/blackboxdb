shared_preload_libraries = 'pg_cron,pg_blackboxdb_core,pg_blackboxdb'

# Set default encoding to UTF8 for testing
client_encoding = 'UTF8'

max_connections = 300
cron.database_name = 'regression'

# Background worker job configs
blackboxdb.bg_worker_database_name = 'regression'
blackboxdb.enableBackgroundWorker = 'true'
blackboxdb.enableBackgroundWorkerJobs = 'true'

blackboxdb.disableExtendedRumExplainPlans = 'true'
blackboxdb.enableExplainScanIndexCosts = 'false'
blackboxdb.enable_default_extended_explain = 'false'

include './regression_opts.conf'
